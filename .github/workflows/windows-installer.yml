name: Installer Windows

# L'installer .exe va costruito su Windows: qui lo produce GitHub, così non
# serve un PC Windows. Lancialo a mano da Actions, oppure pubblica un tag v*.
on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

# necessario per allegare i pacchetti alla release quando si pubblica un tag:
# senza, lo step finale fallisce con "Resource not accessible by integration"
permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: app

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Installa le dipendenze
        run: npm ci

      - name: Test
        run: npm test

      - name: Costruisci installer e versione portatile
        run: npm run dist:win -- --publish never

      - name: Carica i pacchetti
        uses: actions/upload-artifact@v4
        with:
          name: 3D-Print-Cost-Windows
          path: |
            app/dist/*.exe
            app/dist/*.blockmap
          if-no-files-found: error

      - name: Allega alla release (solo sui tag)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            app/dist/*.exe
