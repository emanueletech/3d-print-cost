name: Pacchetti Windows e macOS

# GitHub costruisce tutti i pacchetti: gli .exe su un runner Windows e il .dmg
# su un runner macOS (arm64, Xcode 26). Lancialo a mano da Actions per i
# pacchetti di prova, oppure pubblica un tag v*: in quel caso i file vengono
# allegati alla release insieme alle note in .github/RELEASE_NOTES.md.
on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Se valorizzato (es. v1.1.2) crea il tag e pubblica la release"
        required: false
        default: ''
  push:
    tags:
      - 'v*'

# necessario per allegare i pacchetti alla release quando si pubblica un tag:
# senza, lo step finale fallisce con "Resource not accessible by integration"
permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: app

    steps:
      # major aggiornati al runtime Node 24 delle action (Node 20 rimosso dai runner a settembre 2026)
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Installa le dipendenze
        run: npm ci

      - name: Test
        run: npm test

      - name: Costruisci installer e versione portatile
        run: npm run dist:win -- --publish never

      - name: Carica i pacchetti
        uses: actions/upload-artifact@v7
        with:
          name: 3D-Print-Cost-Windows
          path: |
            app/dist/*.exe
            app/dist/*.blockmap
          if-no-files-found: error

      - name: Allega alla release (tag pubblicato o richiesto dal dispatch)
        if: startsWith(github.ref, 'refs/tags/') || inputs.release_tag != ''
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ inputs.release_tag }}
          name: 3D Print Cost ${{ inputs.release_tag || github.ref_name }}
          body_path: .github/RELEASE_NOTES.md
          files: |
            app/dist/*.exe

  macos:
    runs-on: macos-26
    # dopo il job Windows: sui tag è lui a creare la release, qui si allega solo il DMG
    needs: windows

    steps:
      - uses: actions/checkout@v7

      - name: Compila l'app nativa e crea il DMG
        run: DMG_OUT="$PWD/native/3D-Print-Cost.dmg" bash native/make-dmg.sh

      - name: Carica il pacchetto
        uses: actions/upload-artifact@v7
        with:
          name: 3D-Print-Cost-macOS
          path: native/3D-Print-Cost.dmg
          if-no-files-found: error

      - name: Allega alla release (tag pubblicato o richiesto dal dispatch)
        if: startsWith(github.ref, 'refs/tags/') || inputs.release_tag != ''
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ inputs.release_tag }}
          name: 3D Print Cost ${{ inputs.release_tag || github.ref_name }}
          body_path: .github/RELEASE_NOTES.md
          files: native/3D-Print-Cost.dmg
